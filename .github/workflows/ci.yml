# CI (scaffold plan §13; decisions 0014, 0018). Validation only: this workflow never deploys,
# never builds local fixtures into uploaded output, and needs no secrets.
#
# Environments (scaffold plan §6.2, §7):
#   - preview-rules build:      SITE_ENV=preview  (review + published, no fixtures, everything noindex)
#   - CI verification build:    SITE_ENV=production + SITE_VERIFY_ONLY=1 (production content rules;
#                               launch-readiness items listed as blockers until launch.ready)
#   - deployment guard:         SITE_ENV=production without verification; must FAIL before launch
#   Local builds (fixtures) are never run here.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read the repository, nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality — format, lint, types, tests, repository scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 1 · Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 2 · Formatting
        run: pnpm format:check
      - name: 3a · Lint (TypeScript, Astro, jsx-a11y accessibility rules)
        run: pnpm lint
      - name: 3b · Strict type and template check; content schema validation (astro check, tsc --noEmit)
        run: pnpm typecheck
      - name: 4 · Unit tests (environments, formatting, routing, integrity checks I1–I23, route rules)
        run: pnpm test
      - name: 9 · Repository scan (I7 GPS in images, I21 personal-data patterns, I22 restricted files)
        run: pnpm check:repo

  build:
    name: Build — preview rules, CI verification, integrity, routes, production guards
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 1 · Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 5a · Preview-rules build (integrity checks under preview rules; fixtures must be absent)
        run: pnpm build:preview
      - name: 5b · Preview route validation (R1–R8)
        run: node scripts/with-env.ts preview node scripts/check-routes.ts

      - name: 6 · CI verification build (production rules; I1–I23; I20 internal links; I2 fixtures; I10 unpublished)
        run: pnpm build:verify
      - name: 7 · Bilingual route validation (R1–R8 on production-rules output)
        run: pnpm verify:routes
      - name: 11 · Final production output guard (fixtures, unpublished, internal, preview material)
        run: pnpm verify:output

      - name: Deployment guard (an unconfigured production deployment build must fail before launch)
        env:
          SITE_ENV: production
        run: |
          ready=$(node --input-type=module -e "import('./site.config.ts').then(m => console.log(m.siteConfig.launch.ready))")
          if [ "$ready" = "true" ]; then
            echo "launch.ready is true: this pre-launch guard no longer applies."
            exit 0
          fi
          log="$(mktemp)"
          if pnpm build > "$log" 2>&1; then
            echo "::error::A production deployment build succeeded without the real domain and launch prerequisites."
            exit 1
          fi
          if ! grep -q "Integrity checks failed" "$log"; then
            echo "::error::The deployment build failed for an unexpected reason:"
            cat "$log"
            exit 1
          fi
          echo "Deployment build correctly refused before launch:"
          grep -E "\[I(3|23)\]" "$log" || true

  browser:
    name: Browser — accessibility (enforced) and performance (report-only, OD-25 open)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 1 · Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: CI verification build (production rules only; never local fixtures)
        run: pnpm build:verify

      - name: 8 · Accessibility and performance — mobile (360 px, Lighthouse mobile throttling)
        run: |
          pnpm exec lhci collect --config=.github/lighthouse/mobile.json
          pnpm exec lhci upload --config=.github/lighthouse/mobile.json
          pnpm exec lhci assert --config=.github/lighthouse/mobile.json
      - name: 8 · Accessibility and performance — desktop (1280 px)
        run: |
          pnpm exec lhci collect --config=.github/lighthouse/desktop.json
          pnpm exec lhci upload --config=.github/lighthouse/desktop.json
          pnpm exec lhci assert --config=.github/lighthouse/desktop.json
      - name: 10 · Performance summary (report-only until OD-25 targets are confirmed)
        if: always()
        run: pnpm lighthouse:summary

      - name: Upload Lighthouse reports (production-rules output only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 7
          if-no-files-found: ignore
